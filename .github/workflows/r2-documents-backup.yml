name: R2 document backup (data room, signed NDAs, media)
# NOT YET EVIDENCED: this workflow has never run. It needs a second R2 bucket (ideally in a separate
# Cloudflare account) and R2 API credentials, and it must complete once, followed by a restore check,
# before backups can be called in place. See docs/BACKUPS_AND_RESTORE.md.
on:
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'staging or production'
        required: true
        default: 'staging'
permissions:
  contents: read
jobs:
  backup-documents:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Check configuration
        shell: bash
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_SOURCE_BUCKET: ${{ vars.R2_SOURCE_BUCKET }}
          R2_BACKUP_BUCKET: ${{ vars.R2_BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          for name in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ACCOUNT_ID R2_SOURCE_BUCKET R2_BACKUP_BUCKET; do
            if [ -z "${!name}" ]; then echo "::error::$name is not configured for this environment"; exit 1; fi
          done
          if [ "$R2_SOURCE_BUCKET" = "$R2_BACKUP_BUCKET" ]; then echo '::error::Source and backup bucket must differ'; exit 1; fi
      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version
      - name: Copy new and changed objects (never deletes from the backup)
        shell: bash
        env:
          RCLONE_CONFIG_SRC_TYPE: s3
          RCLONE_CONFIG_SRC_PROVIDER: Cloudflare
          RCLONE_CONFIG_SRC_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_SRC_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_SRC_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_DST_TYPE: s3
          RCLONE_CONFIG_DST_PROVIDER: Cloudflare
          RCLONE_CONFIG_DST_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_DST_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_DST_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          SRC_BUCKET: ${{ vars.R2_SOURCE_BUCKET }}
          DST_BUCKET: ${{ vars.R2_BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          # `copy`, not `sync`: an accidental or malicious delete in the source must never propagate.
          rclone copy "SRC:${SRC_BUCKET}" "DST:${DST_BUCKET}/documents" --checksum --transfers 8 --stats-one-line -v
          # Verify every source object exists in the backup with the same checksum.
          rclone check "SRC:${SRC_BUCKET}" "DST:${DST_BUCKET}/documents" --one-way --checksum
          echo "Backed up and verified $(rclone size "DST:${DST_BUCKET}/documents" --json)"
