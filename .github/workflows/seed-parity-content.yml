name: Seed PHP-parity content (staging)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seed-parity-staging
  cancel-in-progress: false
jobs:
  seed:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute mayfair-platform-staging --env staging --remote --file scripts/seed-php-parity-content.sql
