name: Seed PHP-parity content (staging)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seed-parity-staging
  cancel-in-progress: false
jobs:
  seed:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute mayfair-platform-staging --env staging --remote --file scripts/seed-php-parity-content.sql
