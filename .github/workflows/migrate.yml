name: Apply D1 migrations
on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to migrate
        type: choice
        required: true
        options: [staging, production]
permissions:
  contents: read
concurrency:
  group: d1-migrate-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate target configuration
        run: node scripts/release-readiness.mjs --config-only
      - name: Apply staging migrations
        if: inputs.target == 'staging'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply mayfair-platform-staging --remote --env staging
      - name: Apply production migrations (requires protected production environment approval)
        if: inputs.target == 'production'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply mayfair-platform-production --remote --env production
