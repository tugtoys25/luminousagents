name: Push production secrets to the Worker
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  push:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          environment: production
          secrets: |
            IP_HASH_SECRET
            OTP_ENCRYPTION_KEY
            ADMIN_BOOTSTRAP_TOKEN
            PUBLIC_BASE_URL
        env:
          IP_HASH_SECRET: ${{ secrets.IP_HASH_SECRET }}
          OTP_ENCRYPTION_KEY: ${{ secrets.OTP_ENCRYPTION_KEY }}
          ADMIN_BOOTSTRAP_TOKEN: ${{ secrets.ADMIN_BOOTSTRAP_TOKEN }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
