name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Structure guard
        run: node scripts/check-structure.mjs
      - name: Role/route matrix is current
        run: node scripts/role-matrix.mjs --check
      - name: Leak audit
        run: node --no-warnings scripts/leak-audit.mjs
      - name: Reconcile
        run: node --no-warnings scripts/reconcile.mjs
